<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stops Table</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
            text-align: left;
        }
    </style>
</head>
<body>
<h1>Stops Table</h1>
<table>
    <thead>
    <tr>
        <th>Stop</th>
        <th>Previous Stops</th>
        <th>Next Stops</th>
    </tr>
    </thead>
    <tbody id="stopsTableBody">
    <!-- Rows will be dynamically added here -->
    </tbody>
</table>

<script>
    const tableBody = document.getElementById('stopsTableBody');

    // Fetch data and populate the table
    async function populateTable() {
        try {
            const response = await axios.get('http://localhost:5125/Stop/GetAll?PageIndex=1&PageSize=30');
            const { stops: { items } } = response.data; // Assuming the response is an array of stop objects

            items.forEach(stop => {
                const row = document.createElement('tr');

                const stopCell = document.createElement('td');
                stopCell.textContent = stop.stopName; // Assuming each stop has a 'stopName' field
                row.appendChild(stopCell);

                const prevStopsCell = document.createElement('td');
                prevStopsCell.textContent = stop.prevStops.length > 0 ? stop.prevStops.map(prev => prev.name).join(', ') : 'None';
                row.appendChild(prevStopsCell);

                const nextStopsCell = document.createElement('td');
                nextStopsCell.textContent = stop.nextStops.length > 0 ? stop.nextStops.map(prev => prev.name).join(', ') : 'None';
                row.appendChild(nextStopsCell);

                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error fetching stops:', error);
        }
    }

    // Populate table on page load
    populateTable();
</script>
</body>
</html>
